# Local Postgres for development. `docker compose up -d`, then DATABASE_URL in .env
# points at it (see .env.example). Tests don't need this: they run on PGlite.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kotori
      POSTGRES_PASSWORD: kotori
      POSTGRES_DB: kotori
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotori -d kotori"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
