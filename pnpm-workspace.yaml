packages:
  - apps/*
  - packages/*

# Expo / Metro and React Native autolinking expect a flat node_modules.
nodeLinker: hoisted

allowBuilds:
  '@resvg/resvg-js': true
  esbuild: true
  nx: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - '@expo/ui@57.0.23'
  - '@tanstack/query-core@5.104.2'
  - '@tanstack/react-query@5.104.2'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
  - expo@57.0.28
  - '@better-auth/core@1.7.12'
  - '@better-auth/drizzle-adapter@1.7.12'
  - '@better-auth/expo@1.7.12'
  - '@better-auth/kysely-adapter@1.7.12'
  - '@better-auth/memory-adapter@1.7.12'
  - '@better-auth/mongo-adapter@1.7.12'
  - '@better-auth/prisma-adapter@1.7.12'
  - '@better-auth/telemetry@1.7.12'
  - better-auth@1.7.12
  - better-call@1.4.4
