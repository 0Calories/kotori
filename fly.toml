# fly.toml app configuration file generated for kotori on 2026-10-23T10:26:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kotori'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
dockerfile = 'Dockerfile'

[env]
NODE_ENV = 'production'
PORT = '8080'
# KOTORI_WEB_ORIGINS: the hosted web app's origins, comma-separated (docs/deploy.md §6).

[processes]
api = 'node apps/api/dist/main.js'
worker = 'node apps/worker/dist/main.js work'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['api']

[http_service.concurrency]
type = 'requests'
hard_limit = 250
soft_limit = 200

[[http_service.checks]]
interval = '15s'
timeout = '5s'
grace_period = '30s'
method = 'GET'
path = '/health'

[[restart]]
policy = 'on-failure'
retries = 5

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
cpus = 1
memory_mb = 512
processes = ['api']

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
processes = ['worker']
