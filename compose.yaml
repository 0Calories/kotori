# Local Postgres for development: `docker compose up -d --wait` (or `pnpm dev:setup`).
# The API, the worker and the local auth server share it, as they share Neon in production.
# Postgres 18, the same major as Neon, so generated columns and collation behave alike.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kotori
      POSTGRES_PASSWORD: kotori
      POSTGRES_DB: kotori
    ports:
      - "5432:5432"
    volumes:
      # 18+ images keep their data in a per-major subdirectory (`18/docker`) of this mount and
      # refuse to start with a volume at the old `/var/lib/postgresql/data`. A volume made by
      # Postgres 17 doesn't start either; `pnpm dev:setup` explains how to replace it.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotori -d kotori"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
