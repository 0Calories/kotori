name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for pull requests only. Runs on main deploy, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Sync, format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # `nx affected` compares against the base commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: nrwl/nx-set-shas@v4
      - name: Project references are in sync
        run: pnpm nx sync:check
      - run: pnpm format:check
      - run: pnpm lint
      - name: Typecheck, test and build affected projects
        run: pnpm nx affected -t typecheck test build
        env:
          NX_DAEMON: "false"

  deploy:
    name: Deploy affected apps
    needs: checks
    # `nx affected -t deploy` against the last successful run on main: the Fly app
    # (`@kotori/api:deploy`, API and worker) and the web app (`@kotori/app:deploy`, Vercel).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checks job's builds, which the deploy tasks depend on.
      - uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: nrwl/nx-set-shas@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: 0.5.0
      - run: pnpm nx affected -t deploy
        env:
          NX_DAEMON: "false"
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
