name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Cancel superseded runs for pull requests only. Runs on main deploy, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  NX_DAEMON: "false"

jobs:
  checks:
    name: Sync, format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|build|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits (e.g. 'feat(app): ...' or 'fix: ...'). Got: $PR_TITLE"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `nx affected` compares against the base commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Project references are in sync
        run: pnpm nx sync:check
      - run: pnpm format:check
      - name: Unused files, dependencies, and exports
        run: pnpm knip
      - name: Lint root scripts
        run: pnpm exec oxlint neon.ts vitest.shared.ts tools/*.ts
      # `typecheck` depends on `build` for every TypeScript project; `@kotori/app` builds once inside `vercel build`.
      - name: Lint, typecheck, test and check affected projects
        run: pnpm nx affected -t lint typecheck test check
      # Requires VERCEL_TOKEN as a repository secret (`production` environment secrets only reach `main`).
      - name: Deploy web preview
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set as a repository secret; verifying web build without deploying preview."
            pnpm nx affected -t build --exclude='*,!@kotori/app' --outputStyle=static
            exit 0
          fi
          pnpm nx affected -t deploy-preview --outputStyle=static

  deploy:
    name: Deploy affected apps
    needs: checks
    # `nx affected -t deploy` against the last successful run on main: the Fly app
    # (`@kotori/backend:deploy`, API and worker), then the web app (`@kotori/app:deploy`, Vercel).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The checks job's builds, which the deploy tasks depend on.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.5.0
      # The API before the web app: the app decodes responses with the shared schemas, so a
      # build expecting a new field can't read the old API's responses until Fly has finished.
      - name: Deploy the API and worker
        run: pnpm nx affected -t deploy --exclude=@kotori/app --outputStyle=static
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy the web app
        run: pnpm nx affected -t deploy --exclude='*,!@kotori/app' --outputStyle=static
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Tags web errors with the commit and uploads the source maps (tools/upload-web-sourcemaps.sh).
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD: required
