name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for pull requests only. Runs on main deploy, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Sync, format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # `nx affected` compares against the base commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: nrwl/nx-set-shas@v4
      - name: Project references are in sync
        run: pnpm nx sync:check
      - run: pnpm format:check
      - run: pnpm lint
      - name: Token-limit pre-commit hook
        run: |
          pnpm exec tsc -p tools/tsconfig.json --noEmit --pretty false
          pnpm test:token-limit
      - name: Typecheck, test and build affected projects
        run: pnpm nx affected -t typecheck test build
        env:
          NX_DAEMON: "false"

  deploy:
    name: Deploy to Fly.io
    needs: checks
    # Enable by setting the repository variable FLY_DEPLOY=true once the Fly app exists
    # (`fly launch`) and FLY_API_TOKEN holds a deploy token scoped to it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
