name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for pull requests only. Runs on main deploy, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  NX_DAEMON: "false"

jobs:
  checks:
    name: Sync, format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # `nx affected` compares against the base commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@v4
      - name: Project references are in sync
        run: pnpm nx sync:check
      - run: pnpm format:check
      - name: Lint root scripts
        run: pnpm exec oxlint neon.ts vitest.shared.ts tools/*.ts
      - name: Lint, typecheck, test and build affected projects
        run: pnpm nx affected -t lint typecheck test build check

  deploy:
    name: Deploy affected apps
    needs: checks
    # `nx affected -t deploy` against the last successful run on main: the Fly app
    # (`@kotori/backend:deploy`, API and worker), then the web app (`@kotori/app:deploy`, Vercel).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The checks job's builds, which the deploy tasks depend on.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: 0.5.0
      # The API before the web app: the app decodes responses with the shared schemas, so a
      # build expecting a new field can't read the old API's responses until Fly has finished.
      - name: Deploy the API and worker
        run: pnpm nx affected -t deploy --exclude=@kotori/app --outputStyle=static
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy the web app
        run: pnpm nx affected -t deploy --exclude='*,!@kotori/app' --outputStyle=static
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Tags web errors with the commit and uploads the source maps (tools/upload-web-sourcemaps.sh).
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD: required
